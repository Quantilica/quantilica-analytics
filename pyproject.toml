[project]
name = "quantilica-analytics"
version = "0.8.0"
description = "Analytical data processing and conversion layer for Quantilica"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "data",
    "open-data",
    "brazil",
    "quantilica",
    "parquet",
    "polars",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.2.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "quantilica-core>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/Quantilica/quantilica-analytics"
Repository = "https://github.com/Quantilica/quantilica-analytics"
Issues = "https://github.com/Quantilica/quantilica-analytics/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
    "pandas>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
sources = ["src"]
packages = ["src/quantilica"]
artifacts = ["src/quantilica/analytics/data/*.parquet"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
