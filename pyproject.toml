[project]
name = "quantilica-analytics"
version = "0.2.0"
description = "Analytical data processing and conversion layer for Quantilica"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = [
    "data",
    "open-data",
    "brazil",
    "quantilica",
    "parquet",
    "polars",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "quantilica-core>=0.3.2",
]

[project.urls]
Homepage = "https://github.com/Quantilica/quantilica-analytics"
Repository = "https://github.com/Quantilica/quantilica-analytics"
Issues = "https://github.com/Quantilica/quantilica-analytics/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantilica/analytics"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
